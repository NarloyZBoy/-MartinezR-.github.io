
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <style>
    body {
      background-color: #ffefcc;
      font-family: "Courier New", monospace;
      color: #800000;
      margin: 0;
      padding: 2rem;
    }

    .site-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr);
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-content {
      min-width: 0;
    }

    .archive-panel {
      border-left: 3px solid #800000;
      padding: 1rem 1.5rem;
      min-height: 70vh;
    }

    .archive-panel h2 {
      font-size: 1.8rem;
      margin-top: 0;
      color: #800000;
    }

    .archive-link {
      display: block;
      background: #ffd966;
      border: 2px solid #800000;
      padding: 1rem;
      margin: 1rem 0;
      color: #800000;
      text-decoration: none;
      font-weight: bold;
      text-align: center;
    }

    .archive-link:hover {
      background: #ffc107;
    }

    a {
      color: #4b0082;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 700px) {
      body {
        padding: 1rem;
      }

      .site-layout {
        grid-template-columns: 1fr;
      }

      .archive-panel {
        border-left: none;
        border-top: 3px solid #800000;
        padding: 1rem 0;
        min-height: auto;
      }
    }
    
/* Archival document gallery */
.document-gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  margin: 30px 0;
  align-items: start;
}

.document-card {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #8a5361;
  border-radius: 8px;
  background: #fff8e8;
  box-shadow: 3px 4px 0 rgba(90, 35, 53, 0.12);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.document-card:hover {
  transform: translateY(-4px);
  box-shadow: 5px 7px 0 rgba(90, 35, 53, 0.18);
}

.document-preview {
  height: 250px;
  overflow: hidden;
  background: #e8dfcf;
  border-bottom: 1px solid #8a5361;
}

.document-preview iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

.document-info {
  padding: 16px;
}

.document-info h3 {
  margin-top: 0;
  margin-bottom: 10px;
  font-size: 1.05rem;
}

.document-info p {
  font-size: 0.9rem;
  line-height: 1.5;
}

.document-info a {
  display: inline-block;
  margin-top: 8px;
  padding: 8px 12px;
  border: 1px solid #702d43;
  border-radius: 4px;
  color: #702d43;
  text-decoration: none;
  font-weight: bold;
}

.document-info a:hover {
  background: #702d43;
  color: #fff8e8;
}

@media (max-width: 900px) {
  .document-gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  .document-gallery {
    grid-template-columns: 1fr;
  }
}

  </style>
  


</head>

<body>
  <div class="site-layout">
    <main class="main-content">
      {{ content }}
    </main>

    <aside class="archive-panel">
      <h2>Archival</h2>
      <p>Past projects and technical records.</p>

<a class="archive-link"
   href="{{ '/projects/archival.html' | relative_url }}">
  📁 Browse Archive
</a>

    </aside>
  </div>
</body>
</html>
