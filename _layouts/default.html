
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>

  <style>
    :root {
      --cream: #ffefcc;
      --card: #fff8e8;
      --maroon: #800000;
      --muted-maroon: #702d43;
      --gold: #ffd966;
      --preview-bg: #e8dfcf;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem;
      background: var(--cream);
      color: var(--maroon);
      font-family: "Courier New", monospace;
    }

    a {
      color: #4b0082;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    /* Main site layout */
    .site-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(220px, 1fr);
      gap: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .main-content {
      min-width: 0;
    }

    /* Homepage sidebar */
    .archive-panel {
      border-left: 3px solid var(--maroon);
      padding: 1rem 1.5rem;
      min-height: 70vh;
    }

    .archive-panel h2 {
      margin-top: 0;
      color: var(--maroon);
      font-size: 1.8rem;
    }

    .archive-link {
      display: block;
      margin: 1rem 0;
      padding: 1rem;
      border: 2px solid var(--maroon);
      background: var(--gold);
      color: var(--maroon);
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .archive-link:hover {
      background: #ffc107;
    }

    /* Archive page: use the full width */
    .site-layout:has(.archive-page) {
      display: block;
      max-width: 1200px;
    }

    .archive-page {
      width: 100%;
      padding: 0 0 3rem;
    }

    .archive-page h1 {
      margin: 0 0 0.5rem;
      color: var(--maroon);
      font-size: 2rem;
    }

    .archive-intro {
      margin: 0 0 2rem;
      line-height: 1.6;
    }

    /* PDF thumbnail gallery */
    .document-gallery {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(min(100%, 260px), 300px)
      );
      gap: 1.5rem;
      align-items: start;
    }

    .document-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--muted-maroon);
      border-radius: 6px;
      background: var(--card);
      box-shadow: 0 4px 12px rgba(80, 35, 45, 0.12);
      transition: transform 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .document-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(80, 35, 45, 0.18);
    }

    .pdf-thumbnail {
      display: block;
      height: 340px;
      overflow: hidden;
      border-bottom: 1px solid var(--muted-maroon);
      background: var(--preview-bg);
    }

    .pdf-thumbnail iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      pointer-events: none;
    }

    .document-card h2 {
      margin: 1rem 1rem 0.5rem;
      color: var(--muted-maroon);
      font-size: 1.05rem;
    }

    .document-card p {
      margin: 0 1rem 1rem;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .view-document {
      display: inline-block;
      margin: 0 1rem 1rem;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--muted-maroon);
      border-radius: 4px;
      color: var(--muted-maroon);
      text-decoration: none;
    }

    .view-document:hover {
      background: var(--muted-maroon);
      color: var(--card);
    }

    @media (max-width: 700px) {
      body {
        padding: 1rem;
      }

      .site-layout {
        grid-template-columns: 1fr;
      }

      .archive-panel {
        border-left: none;
        border-top: 3px solid var(--maroon);
        padding: 1rem 0;
        min-height: auto;
      }

      .site-layout:has(.archive-page) {
        display: block;
      }

      .archive-page {
        padding: 0 0 2rem;
      }

      .document-gallery {
        grid-template-columns: minmax(0, 1fr);
      }

      .document-card {
        width: 100%;
        max-width: 360px;
      }
    }
  </style>
</head>

<body>
  <div class="site-layout">

    <main class="main-content">
      {{ content }}
    </main>

    {% unless page.title == "Archival" %}
      <aside class="archive-panel">
        <h2>Archival</h2>
        <p>Past projects and technical records.</p>

 
<a class="archive-link"
   href="{{ '/projects/archival.html' | relative_url }}">
  📁 Browse Archive
</a>

      </aside>
    {% endunless %}

  </div>
</body>
</html>
